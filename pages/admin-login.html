<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - eTravel Agency</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .brand-accent {
      color: #d4af37;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    .form-group input::placeholder {
      color: #999;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background: #d4af37;
      color: #1a1a1a;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .login-button:hover {
      background: #c49d2e;
    }

    .login-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 5px;
      font-size: 14px;
      display: none;
    }

    .alert.error {
      background: #fee;
      color: #c00;
      border: 1px solid #f99;
      display: block;
    }

    .alert.success {
      background: #efe;
      color: #060;
      border: 1px solid #9f9;
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #999;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #d4af37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #d4af37;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }

    .back-link a:hover {
      color: #c49d2e;
    }

    .token-notice {
      background: #fff8e1;
      border-left: 4px solid #fbc02d;
      padding: 12px;
      margin-top: 20px;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }

    .token-notice strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>eTravel Agency</h1>
      <p>Admin Dashboard</p>
    </div>

    <div id="errorAlert" class="alert error"></div>
    <div id="successAlert" class="alert success"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="your@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit" class="login-button" id="submitBtn">
        Sign In
      </button>
      <div class="loading" id="loading">
        <span class="spinner"></span>Verifying credentials...
      </div>
    </form>

    <div class="token-notice">
      <strong>Setup Required:</strong> Before logging in, ensure your Airtable admin token is set in the .env file as <code>AIRTABLE_ADMIN_TOKEN</code>
    </div>

    <div class="back-link">
      <a href="/">← Back to Home</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/airtable-api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');

    function showError(message) {
      errorAlert.textContent = message;
      errorAlert.style.display = 'block';
      successAlert.style.display = 'none';
    }

    function showSuccess(message) {
      successAlert.textContent = message;
      successAlert.style.display = 'block';
      errorAlert.style.display = 'none';
    }

    function hideAlerts() {
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      hideAlerts();
      submitBtn.disabled = true;
      loading.style.display = 'block';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        // Check if token is configured
        if (!AIRTABLE_CONFIG.adminToken) {
          showError(
            'Admin token not configured. Please set AIRTABLE_ADMIN_TOKEN in .env file.'
          );
          submitBtn.disabled = false;
          loading.style.display = 'none';
          return;
        }

        // Attempt login
        const success = await authManager.login(email, password, AIRTABLE_CONFIG.adminToken);

        if (success) {
          showSuccess('Login successful! Redirecting...');
          setTimeout(() => {
            window.location.href = '/pages/admin-dashboard.html';
          }, 1000);
        } else {
          showError('Invalid email or password. Please try again.');
          submitBtn.disabled = false;
          loading.style.display = 'none';
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('An error occurred during login. Please try again.');
        submitBtn.disabled = false;
        loading.style.display = 'none';
      }
    });

    // Clear alerts when user starts typing
    emailInput.addEventListener('input', hideAlerts);
    passwordInput.addEventListener('input', hideAlerts);
  </script>
</body>
</html>
